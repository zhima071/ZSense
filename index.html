<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: zsense-office: zsense-canvas:; media-src 'self' data: blob:; object-src 'self' zsense-canvas:; font-src 'self' data:; connect-src 'self' ws: http://127.0.0.1:4173; frame-src 'self' zsense-office: https: http:"
    />
    <meta
      name="description"
      content="ZSense — 多 Bot、独立记忆、技能、消息网关与自动化工作台"
    />
    <title>ZSense</title>
    <style>
      /* Paint immediately; React keeps this markup while the workspace initializes. */
      .zsense-startup { --startup-particle-primary: var(--primary, #2563eb); --startup-particle-secondary: #0ea5c9; --startup-particle-highlight: #eefbff; --startup-muted: var(--muted, #475569); position: relative; isolation: isolate; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; overflow: hidden; background: radial-gradient(ellipse at 50% 42%, #edf5ff 0, #f9fbff 42%, var(--bg, #fff) 78%); color: var(--text, #0f172a); font-family: Inter, "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .zsense-startup::before { content: ""; position: absolute; z-index: -1; width: min(780px, 95vw); aspect-ratio: 1.2; border-radius: 50%; background: radial-gradient(ellipse, #67e8f90c, #60a5fa08 35%, transparent 67%); }
      .zsense-startup-inner { position: relative; display: flex; align-items: center; flex-direction: column; width: min(660px, calc(100vw - 32px)); padding: 24px 0 48px; text-align: center; }
      .zsense-startup-art { position: relative; width: min(570px, 100%); height: clamp(210px, 38vh, 330px); pointer-events: none; }
      .zsense-startup-particles { position: absolute; inset: 0; width: 100%; height: 100%; }
      .zsense-startup-seed { position: absolute; left: 50%; top: 50%; width: 172px; height: 112px; border-radius: 50%; transform: translate(-50%, -50%) rotate(-20deg); background: conic-gradient(from 20deg, #2563eb00, #2563eb60, #0ea5c970, #2563eb00 65%, #60a5fa55, #2563eb00); mask-image: radial-gradient(ellipse, transparent 40%, #000 48%, transparent 64%); }
      .zsense-startup-particles[data-ready="true"] + .zsense-startup-seed { display: none; }
      .zsense-startup-copy { position: relative; display: flex; flex-direction: column; align-items: center; margin-top: -16px; animation: zsense-startup-reveal 2.4s ease-out both; }
      .zsense-startup-name { font-size: clamp(28px, 4vw, 34px); font-weight: 650; line-height: 1.3; letter-spacing: .065em; text-indent: .065em; }
      .zsense-startup-tagline { margin-top: 9px; color: var(--startup-muted); font-size: 12px; line-height: 1.6; letter-spacing: .15em; }
      .zsense-startup-progress { position: relative; width: 132px; height: 2px; margin-top: 26px; overflow: hidden; border-radius: 100px; background: #dbeafe; }
      .zsense-startup-progress::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, #60a5fa, var(--startup-particle-primary) 60%, var(--startup-particle-secondary)); transform-origin: left center; animation: zsense-startup-progress 2.4s cubic-bezier(.18, .72, .2, 1) both; }
      .zsense-startup-stage { min-height: 20px; margin-top: 14px; color: var(--startup-muted); font-size: 11px; line-height: 20px; }
      @keyframes zsense-startup-progress { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes zsense-startup-reveal { 0%, 15% { opacity: .18; transform: translateY(8px); } 70%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes zsense-startup-wait { 50% { opacity: .46; } }
      .zsense-startup--waiting .zsense-startup-progress::after { animation: zsense-startup-wait 1.5s ease-in-out infinite; }
      .zsense-startup--waiting .zsense-startup-copy, .zsense-startup-prepaint .zsense-startup-copy, .zsense-startup-prepaint .zsense-startup-progress::after { animation: none; }
      .zsense-startup-prepaint .zsense-startup-progress::after { transform: scaleX(0); }
      @media (max-height: 500px) { .zsense-startup-inner { padding: 12px 0; } .zsense-startup-art { height: 190px; } .zsense-startup-progress { margin-top: 16px; } }
      @media (prefers-reduced-motion: reduce) { .zsense-startup-copy, .zsense-startup-progress::after { animation: none; } .zsense-startup-progress::after { transform: scaleX(1); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="zsense-startup zsense-startup-prepaint" role="status" aria-live="polite"><div class="zsense-startup-inner"><div class="zsense-startup-art" aria-hidden="true"><span class="zsense-startup-seed"></span></div><div class="zsense-startup-copy"><strong class="zsense-startup-name">ZSense</strong><span class="zsense-startup-tagline">你的智能工作空间</span><div class="zsense-startup-progress" aria-hidden="true"></div><span class="zsense-startup-stage">正在启动应用…</span></div></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
