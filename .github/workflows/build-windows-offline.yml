name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      resourceDraftTag:
        description: Optional draft release with hash-verified build input
        required: false
        type: string

permissions:
  contents: read

jobs:
  seed-build-inputs:
    name: Read verified official build input from draft
    if: ${{ inputs.resourceDraftTag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Draft releases require push access to read. Keep this token away from
    # checkout, dependency installation, application tests and build scripts.
    permissions:
      contents: write
    steps:
      - name: Fetch pinned official kdocs archive
        env:
          GH_TOKEN: ${{ github.token }}
          ZSENSE_BUILD_RESOURCE_TAG: ${{ inputs.resourceDraftTag }}
        run: |
          if [[ ! "$ZSENSE_BUILD_RESOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '%s\n' 'Invalid build draft tag.' >&2
            exit 1
          fi
          mkdir -p build-inputs
          gh release download "$ZSENSE_BUILD_RESOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'kdocs-cli-2.5.7-windows-amd64.zip' --dir build-inputs
          actual="$(sha256sum build-inputs/kdocs-cli-2.5.7-windows-amd64.zip | cut -d ' ' -f 1)"
          if [[ "$actual" != 'e9a7e152d38db9766a60cc207e9d79d8d9c449c4e38ec8c2b19ed10765780b81' ]]; then
            printf '%s\n' 'Official kdocs archive hash mismatch.' >&2
            exit 1
          fi
      - name: Hand verified archive to read-only build job
        uses: actions/upload-artifact@v4
        with:
          name: verified-windows-build-input
          path: build-inputs/kdocs-cli-2.5.7-windows-amd64.zip
          if-no-files-found: error
          retention-days: 1

  windows-x64:
    name: Windows x64 with ZSense Agent Core
    needs: seed-build-inputs
    if: ${{ !cancelled() && (needs.seed-build-inputs.result == 'success' || needs.seed-build-inputs.result == 'skipped') }}
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      NPM_CONFIG_REGISTRY: ${{ vars.ZSENSE_NPM_REGISTRY || 'https://registry.npmjs.org' }}
      ELECTRON_MIRROR: ${{ vars.ZSENSE_ELECTRON_MIRROR || 'https://npmmirror.com/mirrors/electron/' }}
      ELECTRON_BUILDER_BINARIES_MIRROR: ${{ vars.ZSENSE_ELECTRON_BUILDER_MIRROR || 'https://npmmirror.com/mirrors/electron-builder-binaries/' }}

    steps:
      - name: Check out ZSense
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore official Windows offline tools cache
        uses: actions/cache@v4
        with:
          path: .cache/windows-offline-assets
          key: zsense-windows-offline-v1-${{ hashFiles('scripts/windows-offline-assets.mjs') }}

      - name: Restore pinned offline speech cache
        uses: actions/cache@v4
        with:
          path: .cache/voice-assets
          key: zsense-voice-v1-${{ hashFiles('scripts/voice-assets.mjs') }}

      - name: Receive optional verified official kdocs archive
        if: ${{ inputs.resourceDraftTag != '' }}
        uses: actions/download-artifact@v4
        with:
          name: verified-windows-build-input
          path: .cache/windows-offline-assets

      - name: Verify seeded official kdocs archive
        if: ${{ inputs.resourceDraftTag != '' }}
        shell: pwsh
        run: |
          $hash = (Get-FileHash '.cache/windows-offline-assets/kdocs-cli-2.5.7-windows-amd64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'e9a7e152d38db9766a60cc207e9d79d8d9c449c4e38ec8c2b19ed10765780b81') { throw 'Official kdocs archive hash mismatch.' }

      - name: Prepare pinned Windows offline tools
        shell: pwsh
        env:
          ZSENSE_WINDOWS_ASSET_CACHE: ${{ github.workspace }}\.cache\windows-offline-assets
          ZSENSE_WINDOWS_TOOLS_MIRROR: ${{ vars.ZSENSE_WINDOWS_TOOLS_MIRROR }}
          ZSENSE_VOICE_ASSET_CACHE: ${{ github.workspace }}\.cache\voice-assets
          ZSENSE_VOICE_ASSET_MIRROR: ${{ vars.ZSENSE_VOICE_ASSET_MIRROR }}
        run: |
          npm run tools:prepare:win
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Windows offline resource preparation failed.' }

      - name: Run application checks
        shell: pwsh
        run: |
          $checks = @(
            'typecheck', 'test:runtime', 'test:windows-installer', 'test:windows-tools',
            'test:memory-upgrade', 'test:memory-entrypoints', 'test:memory-ui-model', 'test:scheduled-memory-races',
            'test:office', 'test:scheduled-display', 'test:chat', 'test:voice', 'test:voice-backend',
            'test:voice-playback', 'test:voice-conversation', 'test:independence'
          )
          foreach ($check in $checks) {
            npm run $check
            if ($LASTEXITCODE -ne 0) { throw "Application check failed: $check (exit $LASTEXITCODE)" }
          }

      - name: Build Windows installer
        run: npm run desktop:build:win

      - name: Verify packaged Agent Core
        shell: pwsh
        run: |
          $resources = 'release\win-unpacked\resources'
          if (-not (Test-Path "$resources\app.asar")) {
            throw 'Windows 安装包中缺少 ZSense 应用核心。'
          }
          if (Test-Path "$resources\hermes-runtime") {
            throw 'Windows 安装包不应包含外部 Agent Runtime。'
          }
          $required = @(
            "$resources\bundled-tools\officecli.exe",
            "$resources\bundled-tools\dws.exe",
            "$resources\bundled-tools\kdocs-cli.exe",
            "$resources\bundled-tools\stt\whisper-cli.exe",
            "$resources\bundled-tools\stt\ggml-base-q5_1.bin",
            "$resources\bundled-tools\redist\VC_redist.x64.exe",
            "$resources\bundled-tools\tts\sherpa-onnx-offline-tts.exe",
            "$resources\bundled-tools\tts\onnxruntime.dll",
            "$resources\bundled-tools\tts\onnxruntime_providers_shared.dll",
            "$resources\bundled-tools\tts\manifest.json",
            "$resources\bundled-tools\tts\melo\manifest.json"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "Windows 完整离线包缺少 $file" }
          }
          if (Test-Path "$resources\bundled-tools\tts\moss") { throw 'Legacy MOSS resources must not ship.' }
          if (Test-Path "$resources\bundled-tools\stt\ggml-base.bin") { throw 'Unquantized Whisper base must not ship.' }
          node scripts/verify-windows-offline-tools.mjs "$resources\bundled-tools" "$resources\bundled-tools\tts\melo"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows offline resources failed verification.' }
          node scripts/verify-packaged-app.mjs "$resources\app.asar"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged application feature verification failed.' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          try {
            $asar = (Resolve-Path "$resources\app.asar").Path
            & 'release\win-unpacked\ZSense.exe' 'scripts\memory-upgrade-smoke.mjs' "--app-asar=$asar"
            if ($LASTEXITCODE -ne 0) { throw 'Packaged memory upgrade verification failed.' }
          } finally { Remove-Item Env:\ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue }

      - name: Install the built Windows package
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'release\ZSense-*-win-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced.' }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru
          if (-not $process.WaitForExit(300000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Installer did not exit within five minutes.'
          }
          Write-Host "Installer exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) { throw "Installer failed with $($process.ExitCode)." }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\ZSense\ZSense.exe'
          if (-not (Test-Path $installed -PathType Leaf)) { throw "Installed app is missing: $installed" }
          Write-Host "Installed app exists: $installed"

      - name: Publish installer to optional China object storage
        if: ${{ false }}
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ZSENSE_OBJECT_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ZSENSE_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.ZSENSE_OBJECT_STORAGE_REGION }}
          ZSENSE_STORAGE_ENDPOINT: ${{ vars.ZSENSE_STORAGE_ENDPOINT }}
          ZSENSE_STORAGE_BUCKET: ${{ vars.ZSENSE_STORAGE_BUCKET }}
          ZSENSE_STORAGE_PREFIX: ${{ vars.ZSENSE_STORAGE_PREFIX }}
        run: |
          if (-not $env:AWS_ACCESS_KEY_ID -or -not $env:AWS_SECRET_ACCESS_KEY -or -not $env:ZSENSE_STORAGE_ENDPOINT -or -not $env:ZSENSE_STORAGE_BUCKET) {
            Write-Host 'China object storage is not configured; skipping mirror publish.'
            exit 0
          }
          if (-not $env:AWS_DEFAULT_REGION) { $env:AWS_DEFAULT_REGION = 'auto' }
          $prefix = if ($env:ZSENSE_STORAGE_PREFIX) { $env:ZSENSE_STORAGE_PREFIX.Trim('/') } else { 'zsense' }
          $releaseTarget = "s3://$env:ZSENSE_STORAGE_BUCKET/$prefix/releases"
          $installer = Get-ChildItem 'release\ZSense-*-win-x64.exe' | Select-Object -First 1
          aws s3 cp $installer.FullName "$releaseTarget/$($installer.Name)" --endpoint-url $env:ZSENSE_STORAGE_ENDPOINT --only-show-errors

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ZSense-Windows-x64
          path: |
            release/ZSense-*-win-x64.exe
            release/ZSense-*-win-x64.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
