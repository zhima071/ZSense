name: Repair Windows 0.26.10 Release Asset

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  replace-tested-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Download the Windows-built and installation-tested package
        uses: actions/download-artifact@v4
        with:
          name: ZSense-Windows-x64
          run-id: 37943650031
          github-token: ${{ github.token }}
          path: installer

      - name: Verify source run and stage replacement
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh run view 37943650031 -R zhima071/ZSense --json conclusion --jq .conclusion)" = success
          test -f installer/ZSense-0.26.10-win-x64.exe
          test "$(stat -c %s installer/ZSense-0.26.10-win-x64.exe)" -gt 500000000
          sha256sum installer/ZSense-0.26.10-win-x64.exe
          cp installer/ZSense-0.26.10-win-x64.exe installer/ZSense-0.26.10-win-x64-repair.exe

      - name: Replace only the broken Windows asset and update checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo=zhima071/ZSense
          tag=v0.26.10
          old_name=ZSense-0.26.10-win-x64.exe
          staged_name=ZSense-0.26.10-win-x64-repair.exe
          old_sha=790d6033416136805cc96bcdce287dd956f610c37599875c582dd76021e61946
          new_sha=$(sha256sum "installer/$old_name" | cut -d ' ' -f 1)
          test "$new_sha" != "$old_sha"
          before=$(gh release view "$tag" -R "$repo" --json body,assets)
          old_id=$(jq -r --arg name "$old_name" '.assets[] | select(.name == $name) | .apiUrl | split("/")[-1]' <<< "$before")
          test -n "$old_id"
          body=$(jq -r .body <<< "$before")
          [[ "$body" == *"$old_sha"* ]]
          gh release upload "$tag" "installer/$staged_name" -R "$repo"
          staged_id=$(gh release view "$tag" -R "$repo" --json assets --jq ".assets[] | select(.name == \"$staged_name\") | .apiUrl | split(\"/\")[-1]")
          test -n "$staged_id"
          gh api -X DELETE "repos/$repo/releases/assets/$old_id"
          gh api -X PATCH "repos/$repo/releases/assets/$staged_id" -f name="$old_name" >/dev/null
          updated_body=${body/"$old_sha"/"$new_sha"}
          gh release edit "$tag" -R "$repo" --notes "$updated_body"
          gh release view "$tag" -R "$repo" --json assets,body \
            --jq '{windows: [.assets[] | select(.name == "ZSense-0.26.10-win-x64.exe") | {name,size}], body: .body}'
