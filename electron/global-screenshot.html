<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ZSense 截图</title>
  <style>
    :root { font: 14px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#29231f; background:#f8f7f5; }
    * { box-sizing:border-box; }
    body { margin:0; overflow:hidden; }
    button, input { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible, input:focus-visible { outline:2px solid #b4532a; outline-offset:2px; }
    #select-view, #edit-view, #pin-view { display:none; }
    body[data-mode="select"] #select-view, body[data-mode="edit"] #edit-view, body[data-mode="pin"] #pin-view { display:flex; }
    #select-view { position:fixed; inset:0; align-items:stretch; justify-content:stretch; cursor:crosshair; user-select:none; }
    #select-image { width:100%; height:100%; object-fit:fill; pointer-events:none; }
    #select-dim { position:absolute; inset:0; background:rgba(16,13,11,.38); pointer-events:none; }
    #selection { display:none; position:absolute; border:2px solid #fff; box-shadow:0 0 0 1px #b4532a,0 0 0 9999px rgba(16,13,11,.38); pointer-events:none; }
    #select-dim.dragging { display:none; }
    #select-hint { position:absolute; z-index:3; top:22px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:14px; padding:10px 16px; border:1px solid rgba(255,255,255,.2); border-radius:12px; background:#29231fea; color:#fff; box-shadow:0 10px 30px #0004; white-space:nowrap; cursor:default; }
    #select-hint strong { font-size:13px; }
    #select-hint small { color:#dfd8d1; }
    .icon-button { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border:1px solid #e8e1da; border-radius:8px; background:#fff; color:#665e57; }
    .icon-button:hover, .tool:hover { border-color:#b4532a; color:#98431f; background:#fff7f2; }
    .primary { border-color:#b4532a; background:#b4532a; color:white; }
    .primary:hover { border-color:#98431f; background:#98431f; color:white; }
    #select-close { width:26px; height:26px; border-color:#716760; background:#403933; color:#fff; }
    #edit-view { height:100vh; min-height:0; flex-direction:column; }
    .editor-bar { display:flex; align-items:center; gap:8px; min-height:54px; padding:8px 14px; border-bottom:1px solid #e8e1da; background:#fff; -webkit-app-region:drag; }
    .editor-bar > * { -webkit-app-region:no-drag; }
    .editor-title { margin-right:10px; font-size:14px; white-space:nowrap; }
    .toolbar { display:flex; align-items:center; gap:4px; min-width:0; flex:1; }
    .tool { min-height:32px; padding:0 9px; border:1px solid transparent; border-radius:8px; background:transparent; color:#665e57; font-size:12px; font-weight:600; white-space:nowrap; }
    .tool[aria-pressed="true"] { border-color:#e5bda9; background:#fff2ea; color:#98431f; }
    .divider { width:1px; height:20px; margin:0 5px; background:#e8e1da; }
    .color { width:22px; height:22px; padding:0; border:2px solid white; border-radius:50%; background:var(--swatch); box-shadow:0 0 0 1px #d7cdc4; }
    .color[aria-pressed="true"] { box-shadow:0 0 0 2px #b4532a; }
    #label-wrap { display:none; align-items:center; gap:7px; padding:8px 14px; border-bottom:1px solid #e8e1da; background:#fff; font-size:12px; }
    #label-wrap.visible { display:flex; }
    #label-text { flex:1; max-width:480px; min-height:32px; padding:5px 9px; border:1px solid #d7cdc4; border-radius:8px; }
    #editor-stage { display:flex; align-items:center; justify-content:center; flex:1; min-height:0; overflow:auto; padding:18px; background:#efebe6; }
    #editor-canvas { display:block; flex:none; background:white; box-shadow:0 10px 30px #29231f35; touch-action:none; }
    #editor-canvas[data-tool="text"] { cursor:text; }
    #editor-canvas:not([data-tool="text"]) { cursor:crosshair; }
    .editor-footer { display:flex; align-items:center; gap:8px; min-height:55px; padding:9px 14px; border-top:1px solid #e8e1da; background:#fff; }
    #editor-status { flex:1; min-width:0; color:#665e57; font-size:12px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    #editor-status.error { color:#b13f34; }
    .action { display:inline-flex; align-items:center; gap:6px; min-height:34px; padding:0 12px; border:1px solid #d7cdc4; border-radius:8px; background:#fff; color:#29231f; font-size:12px; font-weight:600; white-space:nowrap; }
    .action:hover { border-color:#b4532a; background:#fff7f2; }
    .action.primary { border-color:#b4532a; background:#b4532a; color:#fff; }
    .action.primary:hover { background:#98431f; }
    .action:disabled { opacity:.45; cursor:wait; }
    #pin-view { height:100vh; flex-direction:column; border:1px solid #d7cdc4; background:#fff; }
    .pin-bar { display:flex; align-items:center; justify-content:space-between; height:34px; padding:0 4px 0 10px; background:#29231f; color:#fff; font-size:11px; -webkit-app-region:drag; }
    .pin-bar button { -webkit-app-region:no-drag; width:28px; height:28px; border:0; border-radius:6px; background:transparent; color:white; font-size:20px; }
    .pin-bar button:hover { background:#ffffff30; }
    #pin-image { width:100%; flex:1; min-height:0; object-fit:contain; background:#fff; }
    @media (max-width:850px) { .editor-title { display:none; } .toolbar { overflow-x:auto; } .editor-bar { gap:4px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
  </style>
</head>
<body>
  <div id="select-view" role="application" aria-label="全局截图选区">
    <img id="select-image" alt="当前屏幕画面">
    <div id="select-dim"></div>
    <div id="selection"></div>
    <div id="select-hint"><strong>拖动鼠标选择截图区域</strong><small>Esc 退出 · 当前鼠标所在显示器</small><button id="select-close" class="icon-button" title="退出截图" aria-label="退出截图">×</button></div>
  </div>
  <div id="edit-view" role="application" aria-label="截图批注编辑器">
    <div class="editor-bar">
      <strong class="editor-title">ZSense 截图</strong>
      <div class="toolbar" role="toolbar" aria-label="批注工具">
        <button class="tool" data-tool="pen" aria-pressed="true" title="画笔">画笔</button>
        <button class="tool" data-tool="ellipse" aria-pressed="false" title="画圈">画圈</button>
        <button class="tool" data-tool="rectangle" aria-pressed="false" title="矩形标注">矩形</button>
        <button class="tool" data-tool="arrow" aria-pressed="false" title="箭头标注">箭头</button>
        <button class="tool" data-tool="text" aria-pressed="false" title="文字标注">文字</button>
        <span class="divider"></span>
        <button class="color" data-color="#dc2626" style="--swatch:#dc2626" aria-label="红色" aria-pressed="true"></button>
        <button class="color" data-color="#2563eb" style="--swatch:#2563eb" aria-label="蓝色" aria-pressed="false"></button>
        <button class="color" data-color="#059669" style="--swatch:#059669" aria-label="绿色" aria-pressed="false"></button>
        <button class="color" data-color="#111827" style="--swatch:#111827" aria-label="黑色" aria-pressed="false"></button>
        <span class="divider"></span>
        <button id="undo" class="tool" title="撤销 Ctrl/⌘+Z" aria-label="撤销批注">撤销</button>
        <button id="redo" class="tool" title="重做 Ctrl/⌘+Shift+Z" aria-label="重做批注">重做</button>
      </div>
      <button id="editor-close" class="icon-button" title="退出截图" aria-label="退出截图">×</button>
    </div>
    <label id="label-wrap">标注文字 <input id="label-text" maxlength="120" placeholder="输入文字后点击截图放置"></label>
    <div id="editor-stage"><canvas id="editor-canvas" aria-label="截图批注画布"></canvas></div>
    <div class="editor-footer">
      <span id="editor-status" role="status" aria-live="polite">在截图上绘制批注。✅ 会复制最终图片。</span>
      <button id="download" class="action" title="下载 PNG 图片">下载 PNG</button>
      <button id="pin" class="action" title="置顶贴在屏幕上">置顶贴图</button>
      <button id="copy" class="action primary" title="复制截图并退出" aria-label="复制截图并退出">✓ 复制</button>
    </div>
  </div>
  <div id="pin-view" role="application" aria-label="置顶截图">
    <div class="pin-bar"><span>置顶截图 · 拖动这里移动</span><button id="pin-close" title="关闭贴图" aria-label="关闭贴图">×</button></div>
    <img id="pin-image" alt="置顶的截图">
  </div>
  <script src="./global-screenshot-ui.js"></script>
</body>
</html>
